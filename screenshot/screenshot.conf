# screenshot configuration
# Place at ~/.config/screenshot/config

# Save directory
SAVE_DIR="$HOME/Pictures/screenshots"

# Filename format (date vars)
# %Y-%m-%d, %H-%M-%S, etc.
FILENAME_FORMAT="screenshot_%Y%m%d_%H%M%S.png"

# Clipboard
AUTO_COPY=true

# Notifications
NOTIFY=true
NOTIFY_TIMEOUT=3000

# Editor for annotation (satty, swappy, gimp, etc.)
EDITOR="satty"
EDITOR_ARGS="--filename"

# Timer default (seconds)
TIMER_DEFAULT=3

# History
HISTORY_ENABLED=true
HISTORY_MAX=100

# Cursor highlight (grim cursor support)
CURSOR_HIGHLIGHT=false
